<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>responsive</title>
	<style>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
		}
		.table-wrapper {
			overflow-x: auto;
			width: 100%;
			height: 100%;
		}
		table {
			border-collapse: collapse;
			width: 100%;
			height: 100%;
			margin: 0;
			border: 1px solid #000;
		}
		td {
			width: 50%;
			height: 100%;
			font-family: Arial, sans-serif;
			font-size: 1.25rem;
			color: #222;
			border: 2px solid #000;
		}
		.box1 { background: #C6CA7B; }
		.box2 { background: #F6BCA6; }
	</style>
</head>
<body>
	<div class="table-wrapper">
		<table>
			<tr>
				<td class="box1">First Cell</td>
				<td class="box2">Second Cell</td>
			</tr>
		</table>
	</div>
</body>
</html>
